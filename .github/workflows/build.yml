name: Build RouteBoost APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Project ZIP
      run: |
        mkdir -p extracted_project
        if [ -f "RouteBoost-Android-CloudBuild.zip" ]; then
          unzip -q RouteBoost-Android-CloudBuild.zip -d extracted_project
        else
          echo "Error: RouteBoost-Android-CloudBuild.zip not found in root directory!"
          exit 1
        fi
        echo "Listing contents of extracted directory:"
        ls -la extracted_project

    - name: Build APK with Gradle
      run: |
        cd extracted_project
        
        # Check if gradlew exists in the extracted files
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        elif find . -name "gradlew" -type f | grep -q .; then
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          cd "$(dirname "$GRADLEW_PATH")"
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "gradlew not found. Installing system Gradle to build..."
          sudo apt-get update && sudo apt-get install -y gradle
          
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            cd "$(dirname "$BUILD_FILE")"
          fi
          gradle assembleDebug
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          extracted_project/**/build/outputs/apk/debug/app-debug.apk