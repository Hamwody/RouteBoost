name: Build RouteBoost APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Project ZIP
      run: |
        mkdir -p extracted_project
        if [ -f "RouteBoost-Android-CloudBuild.zip" ]; then
          unzip -q RouteBoost-Android-CloudBuild.zip -d extracted_project
        else
          echo "Error: RouteBoost-Android-CloudBuild.zip not found in root directory!"
          exit 1
        fi
        echo "Listing contents of extracted directory:"
        ls -la extracted_project

    - name: Find and Build with Gradle
      run: |
        # Find the directory containing gradlew
        GRADLEW_PATH=$(find extracted_project -name "gradlew" -type f | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew file not found inside the extracted ZIP!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found project directory at: $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          extracted_project/**/build/outputs/apk/debug/app-debug.apk
